[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "voting"
version = "0.1.0"
requires-python = ">=3.10"
description = "Deterministic, invariant-preserving proportional allocation engine"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
