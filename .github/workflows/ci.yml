name: CI

# Runs the allocation engine's test suite on every pull request and on
# pushes to main.
#
# The suite is the whole point of this project: src/allocation.rs declares
# the crate's invariants in its module docs (total normalised weight = number
# of voters, total allocated slots = n_slots, surplus conservation counting
# absorbed surplus, deterministic tie-breaking), asserts the first three at
# runtime, and tests/ checks all four. The removed Python engine survives
# only as tests/golden/, the specification tests/parity.rs holds this crate
# to. Invariants that are only checked when someone remembers to run the
# tests are not invariants yet.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        # rustup and a stable toolchain are preinstalled on ubuntu-latest, so
        # no third-party action is needed to get a compiler.
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          cargo --version && rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        # Unit tests, doc tests, and tests/parity.rs - the golden suite holding
        # the removed Python engine's own outputs as the specification.
        run: cargo test
