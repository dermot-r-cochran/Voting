name: CI

# Runs the allocation engine's test suite on every pull request and on
# pushes to main.
#
# The suite is the whole point of this project: allocation.py declares its
# invariants in its header (total normalised weight = len(voters), total
# allocated slots = n_slots, exact surplus conservation, deterministic
# tie-breaking) and tests/test_allocation.py checks them. Invariants that
# are only checked when someone remembers to run pytest are not invariants
# yet.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    # The Rust port is the implementation the repository is moving to; the
    # Python suite below stays until it is removed, so both engines are
    # measured on every change in the meantime.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        # rustup and a stable toolchain are preinstalled on ubuntu-latest, so
        # no third-party action is needed to get a compiler.
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          cargo --version && rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version rather than stopping at the first failure -
      # exact Fraction arithmetic should behave identically across all of
      # them, so a version-specific failure would itself be the finding.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Deliberately NOT `pip install -e .`: pyproject.toml declares
        # build-backend "setuptools.backends.legacy:build", which is not a
        # backend setuptools provides, so a build would fail here for a
        # reason that has nothing to do with the code under test. The
        # package has no runtime dependencies and tests/ is a package, so
        # pytest imports `voting` from the repository root without an
        # install. Fixing the backend is worth its own change.
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: pytest
